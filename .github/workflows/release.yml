name: Windows release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - run: python tools/release.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release exists; leaving unchanged."; exit 0 }
          gh release create $tag "release/sg0hann-SoundSwap-$version-Windows-x64.zip" "release/SHA256SUMS.txt" --target "${{ github.sha }}" --title "sg0hann SoundSwap $version" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
